<!DOCTYPE html>

<head>

<style>
:root{
  --naranja:#E8641B;
  --naranja-oscuro:#B84A0E;
  --naranja-glow:rgba(232,100,27,.35);
  --carbon:#1E2126;
  --gris:#5C616B;
  --blanco:#FFFFFF;
  --display:'Barlow Condensed',sans-serif;
  --texto:'Barlow',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--texto);color:var(--blanco);background:var(--carbon);line-height:1.6;font-size:17px;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;max-width:1080px;margin:0 auto}
.marca{display:flex;align-items:center;gap:10px}
.marca svg{width:42px;height:42px}
.logo{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:1px}
.logo span{color:var(--naranja)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:64px 24px;background:radial-gradient(900px 420px at 78% 20%,rgba(232,100,27,.16),transparent 60%),var(--carbon)}
.card{max-width:640px;text-align:center}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:3px;color:var(--naranja);font-size:15px;margin-bottom:8px}
h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.5px;font-size:clamp(36px,6vw,58px);line-height:1.05;margin-bottom:18px}
p{opacity:.9;font-size:19px;max-width:46ch;margin:0 auto 30px}
.btn{display:inline-block;text-decoration:none;font-weight:600;padding:15px 28px;border-radius:6px;font-size:16px;background:var(--naranja);color:var(--carbon);font-weight:700;box-shadow:0 8px 26px rgba(232,100,27,.35)}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 12px 32px rgba(232,100,27,.5)}
footer{padding:28px 24px;font-size:14px;text-align:center;color:rgba(255,255,255,.7)}
footer a{color:var(--naranja);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="marca" href="/" aria-label="JV Cleaning home">
      <svg viewBox="150 20 330 320" aria-hidden="true"><g transform="translate(-23,10)"><path d="M 230 258 L 372 256 L 392 318 L 212 318 Z" fill="#3A3E45"/><path d="M 195 265 C 185 200 190 140 225 105 C 255 78 300 70 335 85 C 365 97 390 115 405 140 L 430 175 C 438 195 436 215 425 232 C 400 252 360 262 320 262 C 275 262 225 268 195 265 Z" fill="#E8E6E1"/><path d="M 212 110 C 218 56 272 32 322 46 C 352 55 370 76 374 98 L 212 110 Z" fill="#E8641B"/><path d="M 338 92 L 394 84 C 400 94 396 104 384 108 L 342 108 Z" fill="#B84A0E"/><path d="M 398 144 L 450 36 C 464 86 454 138 428 172 Z" fill="#E8641B"/><path d="M 298 124 L 350 132 L 347 145 L 295 137 Z" fill="#23262B"/><circle cx="328" cy="158" r="10" fill="#23262B"/><circle cx="410" cy="206" r="7" fill="#C9C6BF"/></g></svg>
      <div class="logo">JV <span>Cleaning</span></div>
    </a>
  </div>
</header>
<main>
  <div class="card">
    <p class="eyebrow">Request received</p>
    <h1>Thank you</h1>
    <p>Thank you. Your request has been received. We'll follow up using the contact information you provided.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</main>
